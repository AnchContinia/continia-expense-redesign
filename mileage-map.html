  L.polyline(route, { color: '#ffffff', weight: 9, opacity: 0.85, lineJoin: 'round' }).addTo(map);
  L.polyline(route, { color: '#052975', weight: 4.5, opacity: 1, lineJoin: 'round' }).addTo(map);

  L.circleMarker(route[0], {
    radius: 7, color: '#052975', weight: 4, fillColor: '#ffffff', fillOpacity: 1
  }).addTo(map);

  L.marker(route[route.length - 1], {
    icon: L.divIcon({
      className: '',
      html: '<div style="width:24px;height:24px;border-radius:999px;background:#052975;border:2px solid #fff;box-shadow:0 2px 6px rgba(5,41,117,0.4);display:flex;align-items:center;justify-content:center;"><div style="width:7px;height:7px;border-radius:999px;background:#8FF8FF;"></div></div>',
      iconSize: [24, 24], iconAnchor: [12, 12]
    })
  }).addTo(map);

  map.fitBounds(L.latLngBounds(route), { paddingTopLeft: [26, 26], paddingBottomRight: [26, 56] });
</script>
</body>
</html>
